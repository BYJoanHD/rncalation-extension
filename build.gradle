apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

ext {
    extName = 'RNCALATION'
    extClass = '.Rncalation'
    extVersionCode = 1
    isNsfw = false
}

android {
    compileSdk 35
    namespace "eu.kanade.tachiyomi.extension.es.rncalation"

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ['src']
        }
    }

    defaultConfig {
        minSdk 29
        targetSdk 35
        applicationId "eu.kanade.tachiyomi.extension.es.rncalation"
        versionCode extVersionCode
        versionName "1.4.$extVersionCode"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}
